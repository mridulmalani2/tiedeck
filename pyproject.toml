[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "tieout"
version = "0.1.0"
description = "Deterministic, offline PowerPoint QA for investment banking decks, with zero-config client onboarding derived from a single reference deck."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
keywords = ["powerpoint", "pptx", "qa", "linting", "investment-banking", "offline"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Office Suites",
  "Environment :: Console",
  "Typing :: Typed",
]
dependencies = [
  "python-pptx>=1.0",
  "lxml>=5.0",
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13.0",
  "jinja2>=3.1",
  "Pillow>=10.0",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# The optional semantic layer. Deliberately an extra: a core install has no way
# to reach a network, and tests/test_no_network.py proves it by walking the
# syntax tree of every module in `tieout`, which cannot import this package.
review = [
  "anthropic>=1.0",
]
# The local web UI. Also an extra: a desk that only wants the CLI should not
# install a web framework, and nothing in `tieout` imports this either.
ui = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "anthropic>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.0",
  "httpx>=0.27",
]

[project.scripts]
tieout = "tieout.cli:app"
# A separate script rather than a `tieout review` subcommand, so that no module
# in `tieout` imports the review layer and the air-gap walk stays a statement
# about the code rather than about an import guard.
tieout-review = "tieout_review.cli:app"
tieout-ui = "tieout_ui.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["tieout", "tieout_review", "tieout_ui"]
artifacts = [
  "tieout/report/templates/*.j2",
  "tieout/data/*.gz",
  "tieout_ui/static/*.html",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "RUF",
  "ANN",              # annotations
  "TID",              # tidy imports
]
ignore = [
  "ANN401",  # Any is legitimate at the OOXML boundary
  "B008",    # typer uses function calls in argument defaults by design
  "SIM108",  # ternary is not always clearer
  # Detecting curly quotes, en dashes and non-breaking spaces is what this tool
  # is for, so those characters have to appear literally in patterns, test data
  # and messages. Escaping every one of them would make the typography code
  # unreadable to hide a warning that is always a false positive here.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001", "ANN202"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
files = ["tieout", "tieout_review", "tieout_ui", "tests"]
# tests/ has no __init__.py, so without this mypy resolves conftest.py under two
# module names and refuses to check anything.
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["pptx.*", "ruamel.*", "lxml.*", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
# Test helpers are deliberately untyped: a fixture signature spelled out in full
# obscures what the test is asserting, and the tests are not a public interface.
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: deck-building tests that are slower than a unit test",
]

[tool.coverage.run]
source = ["tieout", "tieout_review", "tieout_ui"]
omit = ["tieout/fixtures/*"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]
