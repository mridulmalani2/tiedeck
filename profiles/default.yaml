# A starting-point profile, NOT used automatically.
#
# `tieout check --client NAME` reads profiles/NAME.yaml. This file is here as a
# worked example of what `tieout learn` produces, and as a base to copy when a
# client's reference deck is not yet available:
#
#     cp profiles/default.yaml profiles/acme.yaml
#     # edit the client name, palette, fonts and logo, then
#     tieout check deck.pptx --client acme
#
# Every value below was derived from the synthetic reference deck that
# `tieout scaffold-reference` generates, so none of it describes a real client.
# The 'why:' comments record the evidence behind each value; they are what make
# a finding explicable rather than arbitrary, and `tieout learn` regenerates
# them. Anything you edit by hand should be added to `locks` so a later
# `tieout learn --add` cannot overwrite it.
#
# The `not_learned` section at the end is as important as the rest: those are
# checks TieOut declined to invent from thin evidence, and they are not run.
